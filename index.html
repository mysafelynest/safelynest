<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>협력업체 안전관리 시스템 (PCM Portal)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- 🔐 첫 화면: 로그인 및 회원가입 통합 창 -->
    <div id="auth-view" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
            <!-- 로고 및 안내 -->
            <div class="text-center mb-6">
                <div class="bg-amber-500 text-slate-900 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-md">
                    <i class="fa-solid fa-helmet-safety text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Safety PCM Portal</h1>
                <p class="text-sm text-slate-500 mt-1">협력업체 안전관리 통합 시스템</p>
            </div>

            <!-- 🌐 구글 소셜 회원가입/로그인 버튼 (추천) -->
            <button id="google-btn" onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2.5 rounded-xl transition shadow-sm mb-4">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Google 계정으로 계속하기
            </button>

            <div class="flex items-center my-4">
                <div class="flex-1 border-t border-slate-200"></div>
                <span class="px-3 text-xs text-slate-400">또는 이메일 로그인</span>
                <div class="flex-1 border-t border-slate-200"></div>
            </div>

            <!-- 📧 일반 이메일 로그인/가입 폼 -->
            <form id="email-auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">이메일</label>
                    <input type="email" id="auth-email" required placeholder="example@company.com" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button type="button" onclick="handleEmailLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg text-sm transition">
                        로그인
                    </button>
                    <button type="button" onclick="handleEmailSignUp()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 rounded-lg text-sm transition border border-slate-300">
                        간편 회원가입
                    </button>
                </div>
                <div id="auth-msg" class="text-xs text-center p-2 rounded hidden"></div>
            </form>
        </div>
    </div>

    <!-- 📊 로그인 완료 후 메인 대시보드 화면 -->
    <div id="app-view" class="hidden flex-1 flex flex-col">
        <!-- 상단 헤더 -->
        <header class="bg-slate-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-helmet-safety text-amber-400 text-2xl"></i>
                    <span class="font-bold text-lg">Safety PCM Portal</span>
                    <span id="user-role-badge" class="text-xs px-2.5 py-0.5 rounded-full font-semibold"></span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-slate-300"></span>
                    <button onclick="handleLogout()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition border border-slate-700">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> 로그아웃
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
            <!-- 📌 관리자 권한 전용 화면 -->
            <div id="admin-section" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-users-gear text-amber-600 mr-2"></i>협력업체 종합 관리 (관리자)</h2>
                    <button onclick="alert('신규 협력업체 등록 폼')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-4 py-2 rounded-lg text-sm font-bold shadow transition">
                        <i class="fa-solid fa-plus mr-1"></i> 협력업체 추가
                    </button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 text-slate-600 text-xs uppercase border-b">
                            <tr>
                                <th class="p-4">업체명</th>
                                <th class="p-4">안전등급</th>
                                <th class="p-4">공종</th>
                                <th class="p-4">연락처</th>
                                <th class="p-4">상태</th>
                            </tr>
                        </thead>
                        <tbody id="contractor-table-body" class="divide-y divide-slate-100 text-sm">
                            <!-- 동적 대입 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 📌 협력업체 권한 전용 화면 -->
            <div id="partner-section" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold text-slate-800 mb-2"><i class="fa-solid fa-file-shield text-emerald-600 mr-2">
