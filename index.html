<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의안전 - 현장 스마트 안전보건 통합관리 플랫폼</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mysafety: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#006850',
                            600: '#005440',
                            700: '#004232',
                            800: '#003327',
                            900: '#00261d',
                        }
                    },
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col min-h-screen">

        <!-- ========================================== -->
        <!-- VIEW 1: LANDING & LOGIN                    -->
        <!-- ========================================== -->
        <div id="view-landing" class="flex-1 flex flex-col justify-center items-center p-4 bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-900 relative overflow-hidden">
            <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:4rem_4rem] opacity-40"></div>

            <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden relative z-10 border border-slate-100 my-8">
                <div class="bg-mysafety-500 p-6 text-white text-center relative">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white p-2 mb-3 shadow-md border border-emerald-100">
                        <svg viewBox="0 0 200 200" class="w-full h-full">
                            <path d="M100 20 C80 50 40 70 30 110 C20 140 40 170 65 170 C75 170 85 160 90 140 C95 120 95 90 100 70 C105 90 105 120 110 140 C115 160 125 170 135 170 C160 170 180 140 170 110 C160 70 120 50 100 20 Z" fill="none" stroke="#006850" stroke-width="12"/>
                            <path d="M100 50 L100 170" fill="none" stroke="#006850" stroke-width="16"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">나의안전</h1>
                    <p class="text-xs text-emerald-100 mt-1 font-medium">나의안전 기술사지도사 사무소</p>
                    
                    <div class="grid grid-cols-2 bg-emerald-950/40 p-1 rounded-xl mt-6 border border-white/10 text-sm font-medium">
                        <button id="btn-tab-partner" onclick="switchLoginTab('partner')" class="py-2 rounded-lg bg-white text-emerald-900 shadow">
                            <i class="fa-solid fa-hard-hat mr-1.5 text-emerald-600"></i>건설회사 로그인
                        </button>
                        <button id="btn-tab-manager" onclick="switchLoginTab('manager')" class="py-2 rounded-lg text-emerald-100 hover:text-white">
                            <i class="fa-solid fa-user-shield mr-1.5"></i>관리자 로그인
                        </button>
                    </div>
                </div>

                <div class="p-6">
                    <!-- 건설회사 로그인 -->
                    <form id="form-partner-login" onsubmit="handlePartnerLogin(event)" class="space-y-4">
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="text-lg font-bold text-slate-800">건설회사 로그인</h2>
                            <button type="button" onclick="toggleAuthMode('partner-signup')" class="text-xs text-mysafety-500 font-semibold hover:underline">
                                신규 회원가입 신청 <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">담당자 이메일</label>
                            <input type="email" id="partner-email" required value="safety@partner.co.kr" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-mysafety-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                            <input type="password" id="partner-pw" required value="1234" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-mysafety-500 focus:outline-none">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-mysafety-500 text-white rounded-lg font-semibold hover:bg-mysafety-600 transition shadow">
                            건설회사 접속하기
                        </button>
                    </form>

                    <!-- 건설회사 회원가입 -->
                    <form id="form-partner-signup" onsubmit="handleSignup(event)" class="space-y-3 hidden">
                        <div class="flex justify-between items-center mb-2">
                            <h2 class="text-lg font-bold text-slate-800">회원가입 신청</h2>
                            <button type="button" onclick="toggleAuthMode('partner-login')" class="text-xs text-mysafety-500 font-semibold hover:underline">로그인으로</button>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">건설회사 상호명</label>
                            <input type="text" id="signup-company" required placeholder="(주)한성건설" class="w-full px-3 py-1.5 text-sm border rounded-lg">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">담당자명</label>
                                <input type="text" id="signup-name" required placeholder="홍길동" class="w-full px-3 py-1.5 text-sm border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">연락처</label>
                                <input type="tel" id="signup-phone" required placeholder="010-0000-0000" class="w-full px-3 py-1.5 text-sm border rounded-lg">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">이메일 (아이디)</label>
                            <input type="email" id="signup-email" required placeholder="user@company.com" class="w-full px-3 py-1.5 text-sm border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                            <input type="password" id="signup-pw" required class="w-full px-3 py-1.5 text-sm border rounded-lg">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-mysafety-500 text-white rounded-lg font-semibold hover:bg-mysafety-600 transition shadow">
                            가입 신청 제출
                        </button>
                    </form>

                    <!-- 관리자 로그인 -->
                    <form id="form-manager-login" onsubmit="handleManagerLogin(event)" class="space-y-4 hidden">
                        <div class="mb-2">
                            <h2 class="text-lg font-bold text-slate-800">관리자 로그인</h2>
                            <p class="text-xs text-slate-500">전체 현장 통합 관리 권한</p>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">관리자 이메일</label>
                            <input type="email" id="admin-email" required value="admin@mysafety.co.kr" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
                            <input type="password" id="admin-pw" required value="admin1234" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-slate-900 text-white rounded-lg font-semibold hover:bg-slate-800 transition shadow">
                            관리자 관제 접속
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- VIEW 2: MAIN APP SYSTEM                    -->
        <!-- ========================================== -->
        <div id="view-app-main" class="flex-1 flex flex-col hidden min-h-screen">
            <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md h-16 border-b border-slate-800">
                <div class="px-4 h-full flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('landing')">
                        <div class="w-9 h-9 rounded-lg bg-white p-1 flex items-center justify-center">
                            <svg viewBox="0 0 200 200" class="w-full h-full">
                                <path d="M100 20 C80 50 40 70 30 110 C20 140 40 170 65 170 C75 170 85 160 90 140 C95 120 95 90 100 70 C105 90 105 120 110 140 C115 160 125 170 135 170 C160 170 180 140 170 110 C160 70 120 50 100 20 Z" fill="none" stroke="#006850" stroke-width="14"/>
                                <path d="M100 50 L100 170" fill="none" stroke="#006850" stroke-width="16"/>
                            </svg>
                        </div>
                        <div>
                            <span class="font-bold text-base block">나의안전</span>
                            <span class="text-[10px] text-emerald-400 block font-normal">기술사지도사 사무소</span>
                        </div>
                    </div>

                    <div class="flex items-center space-x-3">
                        <div class="flex items-center space-x-2 text-sm">
                            <div class="w-8 h-8 rounded-full bg-mysafety-500 flex items-center justify-center font-bold text-xs text-white">
                                <span id="user-avatar">관</span>
                            </div>
                            <span id="user-name-display" class="font-medium text-slate-200 text-xs">나의안전 관제자</span>
                        </div>
                        <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2 text-sm" title="로그아웃">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden">
                <!-- 3. 좌측 메뉴 (공지사항, 양식함, 중대재해, 게시판, 회원관리 등 복원) -->
                <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 shadow-sm">
                    <div class="p-4 space-y-5 flex-1 overflow-y-auto">
                        <div>
                            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">안전 관리 워크스페이스</p>
                            <nav class="space-y-1">
                                <button id="side-menu-dashboard" onclick="switchSideView('dashboard')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-bold bg-mysafety-50 text-mysafety-600 border border-emerald-100 transition">
                                    <i class="fa-solid fa-grip text-sm w-4"></i>
                                    <span id="side-menu-dash-label">전사 통합 관제</span>
                                </button>

                                <button id="side-menu-users" onclick="switchSideView('users')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition hidden">
                                    <div class="flex items-center space-x-3">
                                        <i class="fa-solid fa-users-gear text-blue-600 text-sm w-4"></i>
                                        <span>회원가입 승인/관리</span>
                                    </div>
                                    <span id="side-pending-badge" class="bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
                                </button>

                                <button onclick="switchSideView('alert')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                                    <div class="flex items-center space-x-3">
                                        <i class="fa-solid fa-triangle-exclamation text-rose-500 text-sm w-4"></i>
                                        <span>중대재해 알림</span>
                                    </div>
                                    <span class="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">속보</span>
                                </button>

                                <button onclick="switchSideView('docs')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                                    <i class="fa-solid fa-file-shield text-emerald-600 text-sm w-4"></i>
                                    <span>법정 서류 양식함</span>
                                </button>
                            </nav>
                        </div>

                        <div>
                            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">커뮤니티 및 정보</p>
                            <nav class="space-y-1">
                                <button onclick="switchSideView('board')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                                    <i class="fa-solid fa-comments text-indigo-500 text-sm w-4"></i>
                                    <span>현장 소통 게시판</span>
                                </button>

                                <button onclick="switchSideView('notice')" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                                    <div class="flex items-center space-x-3">
                                        <i class="fa-solid fa-bullhorn text-amber-500 text-sm w-4"></i>
                                        <span>공지사항</span>
                                    </div>
                                </button>
                            </nav>
                        </div>

                        <!-- 지도사 자문 요청 바 -->
                        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-xs text-emerald-900 space-y-1.5">
                            <div class="font-bold flex items-center text-emerald-800">
                                <i class="fa-solid fa-user-graduate mr-1.5 text-mysafety-500"></i> 지도사 자문 지원
                            </div>
                            <p class="text-[11px] text-emerald-700 leading-relaxed">
                                중대재해 대응 및 수시 안전 자문이 필요한 경우 언제든 신청하세요.
                            </p>
                            <button onclick="openModal('modal-consult-popup')" class="w-full mt-1 py-1.5 bg-mysafety-500 hover:bg-mysafety-600 text-white font-bold rounded-lg text-[11px] transition">
                                지도사 자문 요청하기
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- MAIN DISPLAY AREA -->
                <div class="flex-1 bg-slate-50 overflow-y-auto p-4 sm:p-6">

                    <!-- 2. 관리자 관제 (모든 건설회사 데이터 확인 및 편집 권한) -->
                    <main id="dashboard-manager" class="max-w-7xl w-full mx-auto space-y-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900">[관리자 권한] 전사 현장 통합 데이터 관리</h2>
                                <p class="text-xs text-slate-500 mt-1">모든 회원사의 현장 정보, 일일 점검표, 교육자료 및 위험성평가를
